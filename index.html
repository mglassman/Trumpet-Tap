<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b24">
  <title>Brass Basics — Trumpet Fingering</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f2e9;
      --muted: #a7b5bc;
      --panel: #192832;
      --panel-light: #223540;
      --gold: #f2bd58;
      --gold-dark: #b88128;
      --mint: #89d6b6;
      --red: #ff9c8f;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      padding: max(22px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -12%, #36505a 0, transparent 53%),
        #101b24;
    }

    main { width: min(100%, 480px); margin: 0 auto; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand-mark {
      display: grid; place-items: center; width: 42px; height: 42px;
      border: 1px solid #765b31; border-radius: 14px; color: var(--gold);
      background: #30281d; font-size: 21px;
    }
    .brand { font-size: 14px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .brand-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .score { color: var(--gold); font-size: 13px; font-weight: 750; }
    .round-meta { display: flex; align-items: center; gap: 12px; }
    .timer { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 750; }
    .card {
      overflow: hidden; padding: 22px 20px 20px; border: 1px solid #314550;
      border-radius: 24px; background: linear-gradient(145deg, #1d303a, var(--panel) 75%);
      box-shadow: 0 18px 50px #0003;
    }

    .prompt { text-align: center; }
    .round-progress { height: 5px; margin: 0 0 20px; overflow: hidden; border-radius: 999px; background: #314550; }
    .round-progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--gold); transition: width .25s ease; }
    .prompt-label { color: var(--muted); font-size: 13px; }
    .note {
      margin: 7px 0 4px; color: var(--ink); font-size: clamp(76px, 24vw, 104px);
      font-weight: 850; letter-spacing: -.075em; line-height: 1.04;
    }
    .note sup { position: relative; top: -.24em; margin-left: 5px; font-size: .35em; letter-spacing: 0; }
    .pitch-label { color: var(--muted); font-size: 12px; }

    .staff { position: relative; width: 190px; height: 84px; margin: 18px auto 4px; }
    .staff-lines {
      position: absolute; top: 20px; right: 0; left: 0; height: 41px;
      background: repeating-linear-gradient(to bottom, #85949a 0 1px, transparent 1px 10px);
      opacity: .8;
    }
    .staff-note {
      position: absolute; left: 50%; z-index: 1; width: 17px; height: 11px;
      border: 2px solid var(--gold); border-radius: 50%; background: var(--panel);
      transform: translate(-50%, -50%) rotate(-18deg);
    }
    .staff-accidental {
      position: absolute; left: calc(50% - 28px); z-index: 2; color: var(--gold);
      display: grid; place-items: center; width: 20px; height: 30px;
      font: 30px/1 Georgia, serif; transform: translateY(-50%);
      pointer-events: none;
    }
    .ledger-line {
      position: absolute; left: 50%; width: 27px; height: 1px; background: #85949a;
      transform: translate(-50%, -50%);
    }
    .staff-clef {
      position: absolute; left: 0; top: 4px; z-index: 2; color: var(--gold);
      font: 58px/1 Georgia, "Times New Roman", serif; letter-spacing: -.04em;
      transform: translateY(-6px);
    }

    .level-selector { display: flex; justify-content: center; gap: 8px; margin: 14px 0 12px; }
    .level-button {
      min-width: 70px; min-height: 34px; padding: 0 10px; border: 1px solid #425660; border-radius: 999px;
      color: var(--muted); background: rgba(17, 31, 38, .72); cursor: pointer; font: inherit;
      font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      transition: border-color .12s, color .12s, background .12s, transform .12s;
    }
    .level-button[aria-pressed="true"] {
      border-color: var(--gold); background: rgba(242, 189, 88, .12); color: var(--gold);
    }
    .level-button:active { transform: scale(.98); }

    .question-title { margin: 19px 0 13px; text-align: center; font-size: 15px; font-weight: 750; }
    .valves { display: flex; justify-content: center; gap: 12px; }
    .valve {
      display: flex; min-width: 82px; min-height: 94px; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; border: 1px solid #425660; border-radius: 17px;
      color: var(--ink); background: #14232c; cursor: pointer; touch-action: manipulation;
      transition: transform .12s, border-color .12s, background .12s, box-shadow .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .valve:active { transform: scale(.96); }
    .valve[aria-pressed="true"] {
      border-color: var(--gold); background: #3a3021; box-shadow: inset 0 0 0 1px #f2bd5833, 0 5px 18px #0002;
    }
    .valve:focus-visible, button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
    .valve-number {
      display: grid; place-items: center; width: 39px; height: 39px; border: 2px solid #718087;
      border-radius: 50%; color: var(--muted); font-size: 17px; font-weight: 850;
    }
    .valve[aria-pressed="true"] .valve-number { border-color: var(--gold); color: var(--gold); }

    .feedback { min-height: 23px; margin: 13px 0 3px; color: var(--muted); text-align: center; font-size: 13px; font-weight: 700; }
    .feedback.correct { color: var(--mint); }
    .feedback.incorrect { color: var(--red); }
    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    button.action {
      min-height: 52px; border: 0; border-radius: 15px; cursor: pointer; font: inherit;
      font-size: 14px; font-weight: 800; touch-action: manipulation;
    }
    button.action:disabled { cursor: default; opacity: .7; }
    button.action.start { grid-column: 1 / -1; color: #21190d; background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); }
    .check { color: #21190d; background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); }
    .check:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--gold-dark); }

    @media (max-width: 360px) {
      body { padding-right: 12px; padding-left: 12px; }
      .card { padding-right: 15px; padding-left: 15px; }
      .valves { gap: 8px; }
      .valve { min-width: 75px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand-mark" aria-hidden="true">♬</div>
      <div>
        <div class="brand">Brass Basics</div>
        <div class="brand-sub">Trumpet fingering practice</div>
      </div>
    </header>

    <div class="score-row">
      <div class="eyebrow" aria-live="polite">Ready to play</div>
      <div class="round-meta">
        <div class="score" aria-live="polite">0 / 10 correct</div>
        <div class="timer" aria-label="Elapsed time">00:00</div>
      </div>
    </div>

    <section class="card" aria-labelledby="question">
      <div class="round-progress" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div class="round-progress-fill"></div>
      </div>
      <div class="prompt">
        <div class="prompt-label">Which valves do you press for</div>
        <h1 class="note" id="question" aria-label="Note to finger">C<sup>4</sup></h1>
        <div class="pitch-label">Written pitch · standard Bb trumpet</div>
        <div class="staff" aria-hidden="true">
          <span class="staff-lines"></span>
          <span class="staff-clef">𝄞</span>
          <span class="ledger-line" hidden></span>
          <span class="staff-accidental"></span>
          <span class="staff-note"></span>
        </div>
      </div>

      <div class="level-selector" aria-label="Practice level selector">
        <button class="level-button" type="button" data-level="1" aria-pressed="true">Level 1</button>
        <button class="level-button" type="button" data-level="2" aria-pressed="false">Level 2</button>
        <button class="level-button" type="button" data-level="3" aria-pressed="false">Level 3</button>
      </div>

      <h2 class="question-title">Choose your valves</h2>
      <div class="valves" aria-label="Trumpet valves">
        <button class="valve" type="button" aria-pressed="false" aria-label="Valve 1, first valve">
          <span class="valve-number">1</span>
        </button>
        <button class="valve" type="button" aria-pressed="false" aria-label="Valve 2, second valve">
          <span class="valve-number">2</span>
        </button>
        <button class="valve" type="button" aria-pressed="false" aria-label="Valve 3, third valve">
          <span class="valve-number">3</span>
        </button>
      </div>

      <div class="feedback" role="status" aria-live="polite">Tap the valves, then check your answer.</div>
      <div class="actions">
        <button class="action start" type="button">Start 10-note round</button>
        <button class="action check" type="button" disabled hidden>Check answer</button>
      </div>
    </section>

  </main>

  <script>
    (() => {
      // Written pitches in the standard beginner range, including sharps and flats.
      const notes = [
        { name: "C", octave: 4, valves: [] },
        { name: "C♯", octave: 4, valves: [1, 2, 3] },
        { name: "D♭", octave: 4, valves: [1, 2, 3] },
        { name: "D", octave: 4, valves: [1, 3] },
        { name: "D♯", octave: 4, valves: [2, 3] },
        { name: "E♭", octave: 4, valves: [2, 3] },
        { name: "E", octave: 4, valves: [1, 2] },
        { name: "F", octave: 4, valves: [1] },
        { name: "F♯", octave: 4, valves: [2] },
        { name: "G♭", octave: 4, valves: [2] },
        { name: "G", octave: 4, valves: [] },
        { name: "G♯", octave: 4, valves: [2, 3] },
        { name: "A♭", octave: 4, valves: [2, 3] },
        { name: "A", octave: 4, valves: [1, 2] },
        { name: "A♯", octave: 4, valves: [1] },
        { name: "B♭", octave: 4, valves: [1] },
        { name: "B", octave: 4, valves: [2] },
        { name: "C", octave: 5, valves: [] },
        { name: "C♯", octave: 5, valves: [1, 2] },
        { name: "D♭", octave: 5, valves: [1,2] },
        { name: "D", octave: 5, valves: [1] },
        { name: "D♯", octave: 5, valves: [2] },
        { name: "E♭", octave: 5, valves: [2] },
        { name: "E", octave: 5, valves: [] },
        { name: "F", octave: 5, valves: [1] },
        { name: "F♯", octave: 5, valves: [2] },
        { name: "G♭", octave: 5, valves: [2] },
        { name: "G", octave: 5, valves: [] }
      ];
      const staffOffsets = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
      const naturalNotes = notes.filter(note => !note.name.includes("♯") && !note.name.includes("♭"));
      const flatNotes = notes.filter(note => !note.name.includes("♯"));
      const levelSets = { 1: naturalNotes, 2: flatNotes, 3: notes };
      const valveButtons = [...document.querySelectorAll(".valve")];
      const levelButtons = [...document.querySelectorAll(".level-button")];
      const noteHeading = document.querySelector(".note");
      const staffNote = document.querySelector(".staff-note");
      const staffAccidental = document.querySelector(".staff-accidental");
      const ledgerLine = document.querySelector(".ledger-line");
      const feedback = document.querySelector(".feedback");
      const scoreDisplay = document.querySelector(".score");
      const roundDisplay = document.querySelector(".eyebrow");
      const timerDisplay = document.querySelector(".timer");
      const progressBar = document.querySelector(".round-progress");
      const progressFill = document.querySelector(".round-progress-fill");
      const startButton = document.querySelector(".start");
      const checkButton = document.querySelector(".check");
      const roundLength = 10;
      let currentNote;
      let correctCount = 0;
      let questionsAnswered = 0;
      let previousIndex = -1;
      let currentLevel = 1;
      let nextTimer;
      let timerInterval;
      let roundStartedAt = 0;
      let roundActive = false;

      function noteLabel(noteName) {
        return noteName
          .replace("♯", " sharp")
          .replace("♭", " flat");
      }

      function setLevel(level) {
        if (roundActive) return;
        currentLevel = level;
        levelButtons.forEach(button => {
          const active = Number(button.dataset.level) === level;
          button.setAttribute("aria-pressed", String(active));
        });
        previousIndex = -1;
        feedback.textContent = "Choose a level, then start your round.";
        feedback.className = "feedback";
        window.clearTimeout(nextTimer);
        nextNote();
      }

      function formatTime(milliseconds) {
        const seconds = Math.floor(milliseconds / 1000);
        return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function updateTimer() {
        timerDisplay.textContent = formatTime(performance.now() - roundStartedAt);
      }

      function startRound() {
        window.clearTimeout(nextTimer);
        window.clearInterval(timerInterval);
        correctCount = 0;
        questionsAnswered = 0;
        previousIndex = -1;
        roundActive = true;
        roundStartedAt = performance.now();
        scoreDisplay.textContent = `0 / ${roundLength} correct`;
        roundDisplay.textContent = `Round 0 / ${roundLength}`;
        timerDisplay.textContent = "00:00";
        progressBar.setAttribute("aria-valuenow", "0");
        progressFill.style.width = "0%";
        startButton.hidden = true;
        checkButton.hidden = false;
        checkButton.textContent = "Check answer";
        levelButtons.forEach(button => { button.disabled = true; });
        updateTimer();
        timerInterval = window.setInterval(updateTimer, 1000);
        nextNote();
      }

      function finishRound() {
        roundActive = false;
        window.clearTimeout(nextTimer);
        window.clearInterval(timerInterval);
        updateTimer();
        roundDisplay.textContent = "Round complete!";
        startButton.textContent = "Play again";
        startButton.hidden = false;
        checkButton.hidden = true;
        checkButton.disabled = true;
        valveButtons.forEach(button => { button.disabled = true; });
        levelButtons.forEach(button => { button.disabled = false; });
        feedback.textContent = `Round complete! You got ${correctCount} / ${roundLength} correct in ${timerDisplay.textContent}.`;
        feedback.className = "feedback correct";
      }

      function nextNote() {
        window.clearTimeout(nextTimer);
        if (questionsAnswered >= roundLength) {
          finishRound();
          return;
        }
        const availableNotes = levelSets[currentLevel];
        let index;
        do {
          index = Math.floor(Math.random() * availableNotes.length);
        } while (availableNotes.length > 1 && index === previousIndex);
        previousIndex = index;
        currentNote = availableNotes[index];
        noteHeading.innerHTML = `${currentNote.name}<sup>${currentNote.octave}</sup>`;
        noteHeading.setAttribute("aria-label", `Note to finger: ${noteLabel(currentNote.name)} ${currentNote.octave}`);
        const staffPosition = staffOffsets[currentNote.name[0]] + (currentNote.octave - 4) * 7;
        const noteTop = 70 - staffPosition * 5;
        staffAccidental.textContent = currentNote.name.includes("♯") ? "♯" : currentNote.name.includes("♭") ? "♭" : "";
        staffNote.style.top = `${noteTop}px`;
        staffAccidental.style.top = `${noteTop}px`;
        ledgerLine.style.top = `${noteTop}px`;
        ledgerLine.hidden = !(currentNote.name === "C" && currentNote.octave === 4);
        valveButtons.forEach(button => {
          button.setAttribute("aria-pressed", "false");
          button.disabled = !roundActive;
        });
        feedback.textContent = roundActive
          ? "Tap the valves, then check your answer."
          : "Choose a level, then start your round.";
        feedback.className = "feedback";
        checkButton.disabled = !roundActive;
        roundDisplay.textContent = roundActive
          ? `Round ${questionsAnswered + 1} / ${roundLength}`
          : "Ready to play";
        progressBar.setAttribute("aria-valuenow", String(questionsAnswered));
        progressFill.style.width = `${questionsAnswered / roundLength * 100}%`;
      }

      function selectedValves() {
        return valveButtons
          .filter(button => button.getAttribute("aria-pressed") === "true")
          .map(button => Number(button.querySelector(".valve-number").textContent))
          .sort((a, b) => a - b);
      }

      valveButtons.forEach(button => {
        button.addEventListener("click", () => {
          if (!roundActive) return;
          const pressed = button.getAttribute("aria-pressed") === "true";
          button.setAttribute("aria-pressed", String(!pressed));
          feedback.textContent = "Ready when you are — check your answer.";
          feedback.className = "feedback";
        });
      });

      checkButton.addEventListener("click", () => {
        if (checkButton.disabled || !roundActive) return;
        const selected = selectedValves();
        const correct = selected.length === currentNote.valves.length &&
          selected.every((valve, index) => valve === currentNote.valves[index]);
        if (correct) {
          correctCount += 1;
          questionsAnswered += 1;
          scoreDisplay.textContent = `${correctCount} / ${roundLength} correct`;
          feedback.textContent = "That's right! Nice work.";
          feedback.className = "feedback correct";
          checkButton.disabled = true;
          valveButtons.forEach(button => { button.disabled = true; });
          roundDisplay.textContent = `Round ${questionsAnswered} / ${roundLength}`;
          progressBar.setAttribute("aria-valuenow", String(questionsAnswered));
          progressFill.style.width = `${questionsAnswered / roundLength * 100}%`;
          if (questionsAnswered === roundLength) {
            finishRound();
          } else {
            nextTimer = window.setTimeout(nextNote, 850);
          }
        } else {
          const answer = currentNote.valves.length ? currentNote.valves.join(" + ") : "open (no valves)";
          feedback.textContent = `Not quite. Try again — the answer is ${answer}.`;
          feedback.className = "feedback incorrect";
        }
      });

      levelButtons.forEach(button => {
        button.addEventListener("click", () => setLevel(Number(button.dataset.level)));
      });

      startButton.addEventListener("click", startRound);
      nextNote();
    })();
  </script>
</body>
</html>
